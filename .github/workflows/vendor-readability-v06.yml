name: Sync V0.6 Readability vendor

on:
  push:
    branches:
      - feat/v0.6-structured-context-bridge
    paths:
      - .github/workflows/vendor-readability-v06.yml
      - extension/offscreen.html
      - extension/offscreen-v06.js

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.6-structured-context-bridge
      - name: Fetch pinned Mozilla Readability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extension/vendor
          PIN=ab4027a8b37669745016869a37a504727992b2ba
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/mozilla/readability/${PIN}/Readability.js" \
            -o extension/vendor/Readability.js
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/mozilla/readability/${PIN}/LICENSE.md" \
            -o extension/vendor/READABILITY-LICENSE.md
          cat > extension/vendor/README.md <<EOF
          # Vendored dependency

          Mozilla Readability is pinned for Link2Context V0.6.

          - upstream: https://github.com/mozilla/readability
          - commit: ${PIN}
          - file: Readability.js
          - license: Apache-2.0 (see READABILITY-LICENSE.md)

          Do not edit the vendored source locally; update the pin through the V0.6 dependency audit.
          EOF
      - name: Commit vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extension/vendor && git ls-files --error-unmatch extension/vendor/Readability.js >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/vendor
          git commit -m "build: vendor pinned Mozilla Readability for V0.6"
          git push origin HEAD:feat/v0.6-structured-context-bridge
